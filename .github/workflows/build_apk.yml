name: Build Green Word v8 (APK and AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Green Word APK and Play Store Bundle
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      working-directory: android
      run: chmod +x gradlew

    - name: Build Release APK and Play Store Bundle (AAB)
      working-directory: android
      run: |
        ./gradlew assembleRelease bundleRelease --no-daemon

    - name: Prepare Artifacts
      run: |
        mkdir -p dist
        cp android/app/build/outputs/apk/release/*.apk dist/Green-Word-v8.apk
        cp android/app/build/outputs/bundle/release/*.aab dist/Green-Word-v8.aab
        ls -la dist/

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Green-Word-v8-APK
        path: dist/Green-Word-v8.apk
        retention-days: 30

    - name: Upload Play Store AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: Green-Word-v8-AAB
        path: dist/Green-Word-v8.aab
        retention-days: 30

    - name: Create Public GitHub Release v8
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v8
        name: Green Word v8
        body: |
          ### Green Word v8 Android Release
          - Direct download without login
          - Developer Profile: Sachinthaka Sandaruwan (Green Soft Technologies)
          - Offline Word Processor with Sinhala Typography
        files: |
          dist/Green-Word-v8.apk
          dist/Green-Word-v8.aab
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
