name: Build Green Word v1 (APK and AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Green Word APK and Play Store Bundle
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      working-directory: android
      run: chmod +x gradlew

    - name: Build Release APK and Play Store Bundle (AAB)
      working-directory: android
      run: |
        ./gradlew assembleRelease bundleRelease --no-daemon

    - name: Prepare Artifacts
      run: |
        mkdir -p dist
        cp android/app/build/outputs/apk/release/*.apk dist/Green-Word-v1.apk
        cp android/app/build/outputs/bundle/release/*.aab dist/Green-Word-v1.aab
        ls -la dist/

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Green-Word-v1-APK
        path: dist/Green-Word-v1.apk
        retention-days: 30

    - name: Upload Play Store AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: Green-Word-v1-AAB
        path: dist/Green-Word-v1.aab
        retention-days: 30
